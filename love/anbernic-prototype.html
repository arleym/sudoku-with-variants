<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sudoku — Anbernic 720×720 Prototype</title>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #111;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 24px 0 48px;
  font-family: 'Courier New', 'Menlo', monospace;
  gap: 20px;
  min-height: 100vh;
}

/* ── Theme vars — applied to any element with data-theme ── */
[data-theme="dark"] {
  --bg:           #1a1a1a;
  --topbar-bg:    #222;
  --topbar-text:  #aaa;
  --topbar-accent:#5a9ee6;
  --grid-bg:      #2a2a2a;
  --border-box:   #888;
  --border-cell:  #3e3e3e;
  --cell-bg:      #2e2e2e;
  --cell-given:   #e8e8e8;
  --cell-user:    #5a9ee6;
  --cell-sel-bg:  #1e3a5f;
  --cell-sel-txt: #90caf9;
  --cell-hl-bg:   #1e3040;
  --cell-sn-bg:   #2a3d25;
  --cell-sn-txt:  #7ec87e;
  --cell-err-bg:  #4a1a1a;
  --cell-err-txt: #e57373;
  --pencil:       #778899;
  --picker-bg:    #222;
  --picker-cell:  #333;
  --picker-txt:   #ccc;
  --picker-cur:   #1e3a5f;
  --picker-cur-txt:#90caf9;
  --picker-border:#444;
  --panel-bg:     #1e1e1e;
  --panel-border: #3a3a3a;
  --label-dim:    #555;
  --label-txt:    #888;
}
[data-theme="nord"] {
  --bg:           #2e3440;
  --topbar-bg:    #3b4252;
  --topbar-text:  #81a1c1;
  --topbar-accent:#88c0d0;
  --grid-bg:      #3b4252;
  --border-box:   #81a1c1;
  --border-cell:  #4c566a;
  --cell-bg:      #434c5e;
  --cell-given:   #eceff4;
  --cell-user:    #88c0d0;
  --cell-sel-bg:  #5e81ac;
  --cell-sel-txt: #eceff4;
  --cell-hl-bg:   #4c566a;
  --cell-sn-bg:   #3d4f3d;
  --cell-sn-txt:  #a3be8c;
  --cell-err-bg:  #4c3030;
  --cell-err-txt: #bf616a;
  --pencil:       #81a1c1;
  --picker-bg:    #3b4252;
  --picker-cell:  #434c5e;
  --picker-txt:   #d8dee9;
  --picker-cur:   #5e81ac;
  --picker-cur-txt:#eceff4;
  --picker-border:#4c566a;
  --panel-bg:     #353c4a;
  --panel-border: #4c566a;
  --label-dim:    #4c566a;
  --label-txt:    #81a1c1;
}
[data-theme="autumn"] {
  --bg:           #1c1410;
  --topbar-bg:    #241a12;
  --topbar-text:  #a89480;
  --topbar-accent:#c87533;
  --grid-bg:      #2a1f18;
  --border-box:   #7a6050;
  --border-cell:  #4a3828;
  --cell-bg:      #332820;
  --cell-given:   #f5ebe0;
  --cell-user:    #e8a060;
  --cell-sel-bg:  #5a3820;
  --cell-sel-txt: #f5d0a0;
  --cell-hl-bg:   #3a2e22;
  --cell-sn-bg:   #2a3018;
  --cell-sn-txt:  #8aaa50;
  --cell-err-bg:  #4a1a1a;
  --cell-err-txt: #e07070;
  --pencil:       #a89480;
  --picker-bg:    #241a12;
  --picker-cell:  #3a2e22;
  --picker-txt:   #e8ddd0;
  --picker-cur:   #5a3820;
  --picker-cur-txt:#f5d0a0;
  --picker-border:#5a4838;
  --panel-bg:     #221810;
  --panel-border: #4a3828;
  --label-dim:    #4a3828;
  --label-txt:    #a89480;
}

/* ── Outer shell ── */
.screen {
  width: 720px;
  height: 720px;
  background: var(--bg);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: 2px solid #333;
  flex-shrink: 0;
}

/* ── Top bar (48px) ── */
.top-bar {
  height: 48px;
  background: var(--topbar-bg);
  display: flex;
  align-items: center;
  padding: 0 14px 0 18px;
  gap: 0;
  border-bottom: 1px solid var(--border-box);
  flex-shrink: 0;
}
.top-bar-left {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex: 1;
}
.top-bar-right {
  display: flex;
  align-items: center;
  gap: 4px;
}
.top-bar-center {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  justify-content: center;
}

/* Wordmark */
.tb-wordmark {
  font-size: 15px;
  font-weight: 700;
  color: var(--topbar-accent);
  letter-spacing: 0.01em;
  white-space: nowrap;
}
.tb-wordmark-sub {
  font-size: 9px;
  color: var(--label-txt);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* Center meta */
.tb-meta {
  font-size: 11px;
  color: var(--topbar-text);
  letter-spacing: 0.05em;
}
.tb-sep { color: var(--label-dim); font-size: 11px; margin: 0 1px; }
.tb-accent { color: var(--topbar-accent); font-weight: bold; }

/* Timer */
.timer {
  font-size: 13px;
  color: var(--topbar-text);
  font-variant-numeric: tabular-nums;
  margin-right: 10px;
}

/* Icon buttons */
.tb-icon-btn {
  width: 34px;
  height: 34px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--topbar-text);
  transition: background 0.1s, border-color 0.1s, color 0.1s;
  flex-shrink: 0;
}
.tb-icon-btn:hover {
  background: var(--border-cell);
  border-color: var(--border-box);
  color: var(--cell-given);
}
.tb-icon-btn.active {
  background: var(--cell-sel-bg);
  border-color: var(--topbar-accent);
  color: var(--topbar-accent);
}
.tb-icon-btn svg { display: block; }

/* ── Middle area (600px) ── */
.middle {
  flex: 1;
  display: flex;
  position: relative;
  overflow: hidden;
}

/* ── Grid area ── */
.grid-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sudoku-grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  grid-template-rows: repeat(9, 1fr);
  width: 594px;
  height: 594px;
  border: 2.5px solid var(--border-box);
  background: var(--grid-bg);
}

.cell {
  border-right: 1px solid var(--border-cell);
  border-bottom: 1px solid var(--border-cell);
  background: var(--cell-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: default;
  font-size: 26px;
  font-weight: normal;
  color: var(--cell-user);
  transition: background 0.08s;
}
.cell:nth-child(9n)   { border-right: none; }
.cell:nth-child(n+73) { border-bottom: none; }

/* Box borders — right */
.cell[data-col="2"],
.cell[data-col="5"] { border-right: 2px solid var(--border-box); }
/* Box borders — bottom */
.cell[data-row="2"] { border-bottom: 2px solid var(--border-box); }
.cell[data-row="5"] { border-bottom: 2px solid var(--border-box); }

.cell.given { color: var(--cell-given); font-weight: 700; }
.cell.selected { background: var(--cell-sel-bg) !important; color: var(--cell-sel-txt) !important; }
.cell.highlighted { background: var(--cell-hl-bg); }
.cell.same-number { background: var(--cell-sn-bg); color: var(--cell-sn-txt); }
.cell.error { background: var(--cell-err-bg); color: var(--cell-err-txt); }

/* Pencil marks grid */
.pencil-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  width: 100%;
  height: 100%;
  padding: 2px;
}
.pencil-mark {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: var(--pencil);
  line-height: 1;
}

/* ── 3D Cube panel ── */
.cube-panel {
  position: absolute;
  top: 0;
  right: 0;
  width: 290px;
  height: 100%;
  background: var(--panel-bg);
  border-left: 1px solid var(--panel-border);
  transform: translateX(290px);
  transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px 16px;
  gap: 12px;
  z-index: 10;
}
.cube-panel.open { transform: translateX(0); }

.cube-panel-title {
  font-size: 11px;
  color: var(--label-txt);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  align-self: flex-start;
}
.cube-panel-hint {
  font-size: 10px;
  color: var(--label-dim);
  text-align: center;
  line-height: 1.6;
}

.layer-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%;
  margin-top: 8px;
}
.layer-tab {
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 0.05em;
  border: 1px solid var(--panel-border);
  color: var(--label-txt);
  background: transparent;
}
.layer-tab.active {
  background: var(--cell-sel-bg);
  color: var(--cell-sel-txt);
  border-color: var(--topbar-accent);
}

/* ── Number picker (76px) ── */
.number-picker {
  height: 76px;
  background: var(--picker-bg);
  border-top: 1px solid var(--border-box);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 16px;
  flex-shrink: 0;
}
.pick-slot {
  width: 60px;
  height: 54px;
  background: var(--picker-cell);
  border: 1px solid var(--picker-border);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: var(--picker-txt);
  position: relative;
  transition: background 0.08s;
}
.pick-slot.cursor {
  background: var(--picker-cur);
  color: var(--picker-cur-txt);
  border-color: var(--topbar-accent);
  box-shadow: 0 0 0 1px var(--topbar-accent);
}
.pick-slot.erase {
  font-size: 18px;
  color: var(--label-txt);
}

/* button hints below picker slots */
.picker-hints {
  position: absolute;
  bottom: 4px;
  left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 16px;
  pointer-events: none;
}
.picker-hint-label {
  font-size: 9px;
  color: var(--label-dim);
  letter-spacing: 0.06em;
}

/* ── Settings flyout ── */
.settings-flyout {
  position: absolute;
  top: 50px;
  right: 12px;
  width: 216px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  z-index: 200;
  overflow: hidden;
  transform-origin: top right;
  transform: scale(0.88) translateY(-6px);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.14s cubic-bezier(0.4,0,0.2,1), opacity 0.14s;
}
.settings-flyout.open {
  transform: scale(1) translateY(0);
  opacity: 1;
  pointer-events: auto;
}
.flyout-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 14px;
  border-bottom: 1px solid var(--panel-border);
  cursor: pointer;
  gap: 10px;
}
.flyout-row:last-child { border-bottom: none; }
.flyout-row:hover { background: var(--cell-hl-bg); }
.flyout-label {
  font-size: 12px;
  color: var(--topbar-text);
  letter-spacing: 0.03em;
  white-space: nowrap;
}
.flyout-label.dim { color: var(--label-txt); font-size: 11px; }
.flyout-section {
  padding: 8px 14px 4px;
  font-size: 9px;
  color: var(--label-dim);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border-bottom: 1px solid var(--panel-border);
}
.flyout-color-row {
  display: flex;
  gap: 5px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--panel-border);
}
.flyout-color-btn {
  flex: 1;
  padding: 6px 0;
  border-radius: 5px;
  font-size: 10px;
  border: 1px solid var(--picker-border);
  background: var(--picker-cell);
  color: var(--picker-txt);
  cursor: pointer;
  text-align: center;
  letter-spacing: 0.03em;
  transition: background 0.08s, border-color 0.08s, color 0.08s;
  font-family: inherit;
}
.flyout-color-btn.active {
  border-color: var(--topbar-accent);
  color: var(--topbar-accent);
  background: var(--cell-sel-bg);
}
.flyout-action {
  display: flex;
  align-items: center;
  padding: 11px 14px;
  gap: 10px;
  cursor: pointer;
  border-bottom: 1px solid var(--panel-border);
  color: var(--topbar-text);
  font-size: 12px;
  letter-spacing: 0.03em;
}
.flyout-action:last-child { border-bottom: none; }
.flyout-action:hover { background: var(--cell-hl-bg); }
.flyout-action-icon { font-size: 14px; width: 18px; text-align: center; }
/* Toggle pill */
.toggle-pill {
  width: 34px;
  height: 19px;
  border-radius: 10px;
  background: var(--label-dim);
  position: relative;
  flex-shrink: 0;
  transition: background 0.18s;
  cursor: pointer;
}
.toggle-pill.on { background: var(--topbar-accent); }
.toggle-pill::after {
  content: '';
  position: absolute;
  width: 15px; height: 15px;
  border-radius: 50%;
  background: #fff;
  top: 2px; left: 2px;
  transition: left 0.18s;
}
.toggle-pill.on::after { left: 17px; }

/* ── Comparison screens ── */
.comparison-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
}
.comparison-label {
  font-size: 11px;
  color: #555;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: -20px;
  align-self: flex-start;
  margin-left: 0;
}
.cmp-screen {
  width: 720px;
  height: 720px;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  border: 2px solid #333;
  flex-shrink: 0;
  overflow: hidden;
  font-family: 'Courier New', 'Menlo', monospace;
  position: relative;
}
.cmp-top {
  height: 48px;
  background: var(--topbar-bg);
  border-bottom: 1px solid var(--border-box);
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 0;
  flex-shrink: 0;
}
.cmp-wordmark { font-size: 15px; font-weight: 700; color: var(--topbar-accent); }
.cmp-wordmark-sub { font-size: 9px; color: var(--label-txt); letter-spacing: 0.12em; text-transform: uppercase; margin-left: 7px; }
.cmp-center { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
.cmp-meta { font-size: 11px; color: var(--topbar-text); letter-spacing: 0.05em; }
.cmp-sep { color: var(--label-dim); font-size: 11px; }
.cmp-right { display: flex; align-items: center; gap: 4px; }
.cmp-icon {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  color: var(--topbar-text);
  border-radius: 7px;
  border: 1px solid transparent;
}
.cmp-middle { flex: 1; display: flex; align-items: center; justify-content: center; }
.cmp-grid {
  display: grid;
  border: 2.5px solid var(--border-box);
  background: var(--grid-bg);
}
.cmp-cell {
  border-right: 1px solid var(--border-cell);
  border-bottom: 1px solid var(--border-cell);
  background: var(--cell-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cell-user);
  font-weight: normal;
  position: relative;
}
.cmp-cell.given { color: var(--cell-given); font-weight: 700; }
.cmp-cell.sel { background: var(--cell-sel-bg); color: var(--cell-sel-txt); }
.cmp-cell.hl  { background: var(--cell-hl-bg); }
.cmp-cell.err { background: var(--cell-err-bg); color: var(--cell-err-txt); }
.cmp-picker {
  height: 76px;
  background: var(--picker-bg);
  border-top: 1px solid var(--border-box);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 16px;
  flex-shrink: 0;
}
.cmp-slot {
  height: 54px;
  min-width: 0;
  background: var(--picker-cell);
  border: 1px solid var(--picker-border);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--picker-txt);
}
.cmp-slot.cur {
  background: var(--picker-cur);
  color: var(--picker-cur-txt);
  border-color: var(--topbar-accent);
  box-shadow: 0 0 0 1px var(--topbar-accent);
}
.cmp-slot.er { color: var(--label-txt); }
.cmp-note {
  position: absolute;
  bottom: 84px;
  left: 0; right: 0;
  text-align: center;
  font-size: 11px;
  color: var(--cell-err-txt);
  background: var(--cell-err-bg);
  padding: 6px 0;
  letter-spacing: 0.04em;
}

/* ── Controls (outside screen) ── */
.controls {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}
.ctrl-btn {
  background: #2a2a2a;
  color: #aaa;
  border: 1px solid #444;
  border-radius: 6px;
  padding: 8px 16px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: background 0.1s, color 0.1s;
}
.ctrl-btn:hover { background: #3a3a3a; color: #ddd; }
.ctrl-btn.active { background: #1e3a5f; color: #90caf9; border-color: #5a9ee6; }
.ctrl-label {
  font-size: 11px;
  color: #555;
  letter-spacing: 0.05em;
}
</style>
</head>
<body>

<div class="screen" data-theme="dark" id="screen">

  <!-- Top bar -->
  <div class="top-bar">

    <!-- Left: wordmark -->
    <div class="top-bar-left">
      <span class="tb-wordmark">Morrison</span>
      <span class="tb-wordmark-sub">Sudoku</span>
    </div>

    <!-- Center: game state -->
    <div class="top-bar-center">
      <span class="tb-meta" id="diffLabel">Easy</span>
      <span class="tb-sep">·</span>
      <span class="tb-meta" id="sizeLabel">9×9</span>
      <span class="tb-sep" id="layerSep" style="display:none">·</span>
      <span class="tb-accent" id="layerLabel" style="display:none"></span>
      <span class="tb-sep" id="pencilSep" style="display:none">·</span>
      <span class="tb-accent" id="pencilLabel" style="display:none">✏ Pencil</span>
    </div>

    <!-- Right: timer + icon buttons -->
    <div class="top-bar-right">
      <span class="timer">08:42</span>

      <!-- Help -->
      <button class="tb-icon-btn" id="helpBtn" title="Help" onclick="alert('Help coming soon')">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="9" r="7.5"/>
          <path d="M6.8 6.8a2.2 2.2 0 0 1 4.3.7c0 1.5-2.1 1.8-2.1 3.5"/>
          <circle cx="9" cy="13.5" r="0.7" fill="currentColor" stroke="none"/>
        </svg>
      </button>

      <!-- Layers (3D overview toggle) -->
      <button class="tb-icon-btn" id="layersBtn" title="3D Layers [Select]" onclick="toggleCube()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- three stacked isometric slabs -->
          <polyline points="2,6 9,2.5 16,6 9,9.5 2,6"/>
          <polyline points="2,9.5 9,13 16,9.5"/>
          <line x1="2" y1="6" x2="2" y2="9.5"/>
          <line x1="16" y1="6" x2="16" y2="9.5"/>
          <line x1="9" y1="9.5" x2="9" y2="13"/>
          <polyline points="2,7.7 9,11.2 16,7.7"/>
        </svg>
      </button>

      <!-- Settings -->
      <button class="tb-icon-btn" id="settingsBtn" title="Settings" onclick="toggleSettings()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="9" r="2.5"/>
          <path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2
                   M3.6 3.6l1.4 1.4M13 13l1.4 1.4
                   M14.4 3.6l-1.4 1.4M5 13l-1.4 1.4"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- Settings flyout (inside .screen so theme vars apply) -->
  <div class="settings-flyout" id="settingsFlyout">

    <!-- Pencil mode -->
    <div class="flyout-row" onclick="togglePencil()">
      <span class="flyout-label">✏&nbsp; Pencil Mode</span>
      <div class="toggle-pill" id="pencilToggle"></div>
    </div>

      <button class="flyout-color-btn"        id="fc-nord"   onclick="setTheme('nord');   event.stopPropagation()">Nord</button>

    <div class="flyout-action" onclick="closeFlyout()">
      <span class="flyout-action-icon">↗</span>
      <span>Share</span>
    </div>

  </div>

  <!-- Middle: grid + sliding panel -->
  <div class="middle">
    <div class="grid-area">
      <div class="sudoku-grid" id="grid"></div>
    </div>

    <!-- 3D cube panel (slides in from right) -->
    <div class="cube-panel" id="cubePanel">
      <div class="cube-panel-title">3D Overview</div>
      <svg id="isoCube" width="240" height="280" viewBox="0 0 240 280"></svg>
      <div class="layer-tabs" id="layerTabs"></div>
      <div class="cube-panel-hint">
        L1 / R1 — change layer<br>
        [Select] — close
      </div>

  <!-- Number picker -->
  <div class="number-picker">
    <div class="pick-slot cursor" data-n="1">1</div>
    <div class="pick-slot" data-n="2">2</div>
    <div class="pick-slot" data-n="3">3</div>
    <div class="pick-slot" data-n="4">4</div>
    <div class="pick-slot" data-n="5">5</div>
    <div class="pick-slot" data-n="6">6</div>

</div>

<!-- Controls outside the screen -->
<div class="controls">
  <span class="ctrl-label">Theme:</span>
  <button class="ctrl-btn active" onclick="setTheme('dark')">Dark</button>
  <button class="ctrl-btn" onclick="setTheme('nord')">Nord</button>

  <button class="ctrl-btn" id="pencilBtn" onclick="togglePencil()">Pencil Mode [X]</button>
</div>

<!-- ════ SIZE COMPARISON ════ -->
<div class="comparison-section" id="comparisons"></div>

<script>
// ── Puzzle data ──────────────────────────────────────────────────────────────
// Classic "easy" 9×9. null = empty, negative = user-entered, positive = given
const GIVEN = 1, USER = 2, EMPTY = 0;

const puzzleData = [
  // row 0
  {v:5,t:GIVEN},{v:3,t:GIVEN},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:7,t:GIVEN},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:0,t:EMPTY},
  // row 1
  {v:6,t:GIVEN},{v:2,t:USER},{v:7,t:USER},{v:1,t:GIVEN},{v:9,t:GIVEN},{v:5,t:GIVEN},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:0,t:EMPTY},
  // row 2
  {v:1,t:USER},{v:9,t:GIVEN},{v:8,t:GIVEN},{v:3,t:USER},{v:4,t:USER},{v:0,t:EMPTY},{v:7,t:USER},{v:6,t:GIVEN},{v:0,t:EMPTY},
  // row 3
  {v:8,t:GIVEN},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:6,t:GIVEN},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:3,t:GIVEN},
  // row 4 — selected cell is [4][4] (empty, pencil marks)
  {v:4,t:GIVEN},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:8,t:GIVEN},{v:0,t:EMPTY},{v:3,t:GIVEN},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:1,t:GIVEN},
  // row 5
  {v:7,t:GIVEN},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:2,t:GIVEN},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:6,t:GIVEN},
  // row 6
  {v:0,t:EMPTY},{v:6,t:GIVEN},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:2,t:GIVEN},{v:8,t:GIVEN},{v:0,t:EMPTY},
  // row 7
  {v:0,t:EMPTY},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:4,t:GIVEN},{v:1,t:GIVEN},{v:9,t:GIVEN},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:5,t:GIVEN},
  // row 8
  {v:0,t:EMPTY},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:8,t:GIVEN},{v:0,t:EMPTY},{v:0,t:EMPTY},{v:7,t:GIVEN},{v:9,t:GIVEN},
];

const SELECTED_IDX = 40; // row 4, col 4
const PENCIL_MARKS = { 40: [1,5,9], 31: [1,4], 37: [4,7,9], 49: [5,9] };
// Error example: a wrong user value
const ERROR_CELLS = new Set([18]); // row 2, col 0 — 1 is wrong here visually

// Same-number: highlight cells with value 9 (same as pencil mark in selected)
const SN_VALUE = 9;

let isPencilMode = false;
let isCubeOpen = false;
let is3DMode = false;
const DEPTH = 4;
let activeLayer = 1; // 0-indexed

// ── Build grid ───────────────────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const selRow = Math.floor(SELECTED_IDX / 9);
  const selCol = SELECTED_IDX % 9;
  const selBox = Math.floor(selRow / 3) * 3 + Math.floor(selCol / 3);

  puzzleData.forEach((cell, idx) => {
    const row = Math.floor(idx / 9);
    const col = idx % 9;
    const box = Math.floor(row / 3) * 3 + Math.floor(col / 3);

    const div = document.createElement('div');
    div.className = 'cell';
    div.dataset.row = row;
    div.dataset.col = col;

    // State classes
    if (idx === SELECTED_IDX) {
      div.classList.add('selected');
    } else if (ERROR_CELLS.has(idx)) {
      div.classList.add('error');
    } else if (row === selRow || col === selCol || box === selBox) {
      div.classList.add('highlighted');
    } else if (cell.v !== 0 && cell.v === SN_VALUE) {
      div.classList.add('same-number');
    }

    if (cell.t === GIVEN) div.classList.add('given');

    // Content
    const pencilSet = PENCIL_MARKS[idx];
    if (isPencilMode && idx === SELECTED_IDX) {
      // Show pencil overlay
      div.innerHTML = buildPencilGrid([1,5,9]);
    } else if (!isPencilMode && pencilSet) {
      div.innerHTML = buildPencilGrid(pencilSet);
    } else if (cell.v !== 0) {
      div.textContent = cell.v;
    }

    grid.appendChild(div);
  });
}

function buildPencilGrid(marks) {
  let html = '<div class="pencil-grid">';
  for (let n = 1; n <= 9; n++) {
    html += `<div class="pencil-mark">${marks.includes(n) ? n : ''}</div>`;
  }
  html += '</div>';
  return html;
}

// ── Isometric cube SVG ───────────────────────────────────────────────────────
const LAYER_COLORS = ['#4a90d9','#5ba85c','#e07b39','#9b59b6'];
const LAYER_COLORS_DIM = ['#1a3555','#1f3d22','#4a2a14','#3a1f4a'];

function buildIsoCube() {
  const svg = document.getElementById('isoCube');
  const size = 4, depth = DEPTH;
  const SVG_W = 240;
  const IX = 22, IY = 11, JX = -22, JY = 11;
  const LAYER_STEP_Y = 38;
  const OX = SVG_W / 2, OY = 16;
  const SVG_H = OY + depth * LAYER_STEP_Y + size * IY + 16;

  svg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);
  svg.setAttribute('height', SVG_H);
  svg.innerHTML = '';

  function origin(layer) {
    return [OX, OY + layer * LAYER_STEP_Y];
  }
  function slabPath(layer) {
    const [ox, oy] = origin(layer);
    const pts = [
      [ox, oy],
      [ox + size*IX, oy + size*IY],
      [ox + size*IX + size*JX, oy + size*IY + size*JY],
      [ox + size*JX, oy + size*JY],
    ];
    return 'M' + pts.map(p => p.join(',')).join(' L') + ' Z';
  }
  function gridLines(layer) {
    const [ox, oy] = origin(layer);
    let d = '';
    for (let i = 0; i <= size; i++) {
      const bold = i % 2 === 0;
      // row lines
      d += `M${ox + i*JX},${oy + i*JY} L${ox + i*JX + size*IX},${oy + i*JY + size*IY} `;
      // col lines
      d += `M${ox + i*IX},${oy + i*IY} L${ox + i*IX + size*JX},${oy + i*IY + size*JY} `;
    }
    return d;
  }

  // Draw bottom-to-top
  for (let i = depth - 1; i >= 0; i--) {
    const isActive = i === activeLayer;
    const color = LAYER_COLORS[i % LAYER_COLORS.length];
    const dimColor = LAYER_COLORS_DIM[i % LAYER_COLORS_DIM.length];
    const opacity = isActive ? 1 : 0.5;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.style.opacity = opacity;
    g.style.cursor = 'pointer';
    g.addEventListener('click', () => { setLayer(i); });

    // Slab fill
    const slab = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    slab.setAttribute('d', slabPath(i));
    slab.setAttribute('fill', isActive ? dimColor : '#1a1a22');
    slab.setAttribute('stroke', color);
    slab.setAttribute('stroke-width', isActive ? 1.5 : 0.8);
    g.appendChild(slab);

    // Grid lines
    const lines = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    lines.setAttribute('d', gridLines(i));
    lines.setAttribute('stroke', color);
    lines.setAttribute('stroke-width', '0.5');
    lines.setAttribute('fill', 'none');
    lines.setAttribute('opacity', '0.5');
    g.appendChild(lines);

    // Some fill dots (simulating filled cells)
    const dotPattern = [
      [0,0],[0,2],[1,1],[1,3],[2,0],[2,3],[3,2],
      [0,1],[2,1],[3,0],[3,3],
    ];
    const showDots = i === 0 ? [[0,0],[1,1],[2,2],[3,3],[0,3]] :
                    i === 1 ? [[0,1],[1,2],[2,0],[3,1]] :
                    i === 2 ? [[0,2],[1,0],[2,3],[3,2],[1,3]] :
                              [[0,0],[1,1],[2,2]];

    const [ox, oy] = origin(i);
    showDots.forEach(([r,c]) => {
      const tlx = ox + c*IX + r*JX;
      const tly = oy + c*IY + r*JY;
      const pts = [
        [tlx, tly], [tlx+IX, tly+IY],
        [tlx+IX+JX, tly+IY+JY], [tlx+JX, tly+JY]
      ];
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      dot.setAttribute('d', 'M'+pts.map(p=>p.join(',')).join(' L')+' Z');
      dot.setAttribute('fill', color);
      dot.setAttribute('opacity', '0.6');
      g.appendChild(dot);
    });

    // Layer label
    const [lox, loy] = origin(i);
    const cx = lox + (size/2)*IX + (size/2)*JX;
    const cy = loy + (size/2)*IY + (size/2)*JY;
    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('x', cx);
    txt.setAttribute('y', cy + 1);
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('dominant-baseline', 'middle');
    txt.setAttribute('font-size', isActive ? '10' : '8');
    txt.setAttribute('font-family', 'Courier New, monospace');
    txt.setAttribute('font-weight', isActive ? 'bold' : 'normal');
    txt.setAttribute('fill', color);
    txt.setAttribute('pointer-events', 'none');
    txt.textContent = `L${i+1}`;
    g.appendChild(txt);

    svg.appendChild(g);
  }
}

function buildLayerTabs() {
  const tabs = document.getElementById('layerTabs');
  tabs.innerHTML = '';
  for (let i = 0; i < DEPTH; i++) {
    const tab = document.createElement('div');
    tab.className = 'layer-tab' + (i === activeLayer ? ' active' : '');
    tab.textContent = `Layer ${i+1}`;
    tab.addEventListener('click', () => setLayer(i));
    tabs.appendChild(tab);
  }
}

function setLayer(i) {
  activeLayer = i;
  buildIsoCube();
  buildLayerTabs();
  updateTopBar();
}

// ── State updates ─────────────────────────────────────────────────────────────
function updateTopBar() {
  const layerLabel  = document.getElementById('layerLabel');
  const layerSep    = document.getElementById('layerSep');
  const pencilLabel = document.getElementById('pencilLabel');
  const pencilSep   = document.getElementById('pencilSep');

  if (is3DMode) {
    layerLabel.textContent = `L ${activeLayer+1}/${DEPTH}`;
    layerLabel.style.display = '';
    layerSep.style.display = '';
    document.getElementById('sizeLabel').textContent = `4×4×4`;
  } else {
    layerLabel.style.display = 'none';
    layerSep.style.display = 'none';
    document.getElementById('sizeLabel').textContent = `9×9`;
  }

  if (isPencilMode) {
    pencilLabel.style.display = '';
    pencilSep.style.display = '';
  } else {
    pencilLabel.style.display = 'none';
    pencilSep.style.display = 'none';
  }

  document.getElementById('diffLabel').textContent = is3DMode ? 'Medium' : 'Easy';
}

// ── Controls ─────────────────────────────────────────────────────────────────
let currentTheme = 'dark';
let isFlyoutOpen = false;

function setTheme(t) {
  currentTheme = t;
  document.getElementById('screen').dataset.theme = t;
  // Sync outside ctrl-btns
  document.querySelectorAll('.ctrl-btn').forEach(b => {
    if (b.textContent.toLowerCase().includes(t)) b.classList.add('active');
    else if (['Dark','Nord','Autumn'].some(x => b.textContent.includes(x))) b.classList.remove('active');
  });
  // Sync flyout color buttons
  ['dark','nord','autumn'].forEach(k => {
    const el = document.getElementById('fc-' + k);
    if (el) el.classList.toggle('active', k === t);
  });
  buildIsoCube();
  buildComparisons();
}

function toggleSettings() {
  isFlyoutOpen = !isFlyoutOpen;
  document.getElementById('settingsFlyout').classList.toggle('open', isFlyoutOpen);
  document.getElementById('settingsBtn').classList.toggle('active', isFlyoutOpen);
}

function closeFlyout() {
  isFlyoutOpen = false;
  document.getElementById('settingsFlyout').classList.remove('open');
  document.getElementById('settingsBtn').classList.remove('active');
}

function toggleCube() {
  isCubeOpen = !isCubeOpen;
  document.getElementById('cubePanel').classList.toggle('open', isCubeOpen);
  document.getElementById('layersBtn').classList.toggle('active', isCubeOpen);
  const btn = document.getElementById('cubeBtn');
  if (btn) btn.classList.toggle('active', isCubeOpen);
}

function toggleMode() {
  is3DMode = !is3DMode;
  const btn = document.getElementById('modeBtn');
  btn.textContent = is3DMode ? 'Switch to 2D Mode' : 'Switch to 3D Mode';
  btn.classList.toggle('active', is3DMode);
  if (!is3DMode && isCubeOpen) toggleCube();
  updateTopBar();
  buildGrid();
}

function togglePencil() {
  isPencilMode = !isPencilMode;
  const btn = document.getElementById('pencilBtn');
  if (btn) btn.classList.toggle('active', isPencilMode);
  // Sync flyout toggle
  const pill = document.getElementById('pencilToggle');
  if (pill) pill.classList.toggle('on', isPencilMode);
  updateTopBar();
  buildGrid();
}

// Close flyout when clicking outside
document.addEventListener('click', e => {
  if (isFlyoutOpen &&
      !e.target.closest('#settingsFlyout') &&
      !e.target.closest('#settingsBtn')) {
    closeFlyout();
  }
});

// Keyboard shortcut: Space or S = toggle cube panel
window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Select') { e.preventDefault(); toggleCube(); }
  if (e.key === 'p' || e.key === 'P') togglePencil();
  if (e.key === '[') setLayer(Math.max(0, activeLayer - 1));
  if (e.key === ']') setLayer(Math.min(DEPTH-1, activeLayer + 1));
  if (e.key >= '1' && e.key <= '9') {
    const n = parseInt(e.key);
    document.querySelectorAll('.pick-slot').forEach(s => {
      s.classList.toggle('cursor', parseInt(s.dataset.n) === n);
    });
  }
});

// ── Comparison screens ────────────────────────────────────────────────────────
// Showing how 2D grid sizes look on 720×720.
// size = N where the puzzle is N×N with √N × √N boxes.
// 9×9  → 3×3 boxes, values 1–9    (standard)
// 16×16 → 4×4 boxes, values 1–16  (large)
// 25×25 → 5×5 boxes, values 1–25  (probably too small on screen)

const CMP_SIZES = [
  { size: 9,  label: '9×9 (standard)',  note: null },
  { size: 16, label: '16×16',           note: null },
  { size: 25, label: '25×25',           note: '⚠ Cells are ~24px — readable but tight. Values 1–25 make the number strip very cramped.' },
];

// Tiny seeded RNG so fill looks natural, same every render
function seededRnd(seed) {
  let s = seed;
  return () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
}

function buildComparisonScreen({ size, label, note }) {
  const rnd = seededRnd(size * 31 + 17);
  const BOX = Math.round(Math.sqrt(size)); // 3 for 9×9, 4 for 16×16, 5 for 25×25

  // Usable middle area: 720 - 48 top - 76 bottom = 596px
  const GRID_PX = Math.min(596, Math.floor(596 / size) * size);
  const CELL_PX = GRID_PX / size;
  const FONT_PX = Math.max(8, Math.min(Math.round(CELL_PX * 0.50), 48));

  // Fill ~40% of cells with sample values
  const cells = Array.from({length: size * size}, () => {
    if (rnd() < 0.42) return { v: Math.ceil(rnd() * size), given: rnd() > 0.4 };
    return { v: 0, given: false };
  });
  // Selected cell near center
  const selRow = Math.floor(size / 2);
  const selCol = Math.floor(size / 2);
  const selIdx = selRow * size + selCol;
  const selBox = Math.floor(selRow / BOX) * BOX + Math.floor(selCol / BOX);
  cells[selIdx] = { v: 0, given: false, sel: true };

  // Number picker: 9 values fit at 60px. 16 values need ~38px. 25 values need ~25px.
  const pickerItems = size + 1; // values + erase
  const slotW = Math.max(20, Math.floor((720 - 24) / pickerItems));
  const slotFont = Math.max(8, Math.min(22, Math.round(slotW * 0.52)));
  const curNum = Math.ceil(size / 2);

  // For 16×16, values 10–16 display as A–G (single char); for 25×25 truncate to 2-digit
  function cellLabel(v) {
    if (size > 9 && v > 9) return String.fromCharCode(55 + v); // A=10, B=11...
    return v;
  }

  const screen = document.createElement('div');
  screen.className = 'cmp-screen';
  screen.dataset.theme = currentTheme;

  // ── Top bar
  screen.innerHTML = `
    <div class="cmp-top">
      <div style="display:flex;align-items:baseline;gap:7px;flex:1">
        <span class="cmp-wordmark">Morrison</span>
        <span class="cmp-wordmark-sub">Sudoku</span>
      </div>
      <div class="cmp-center">
        <span class="cmp-meta">Medium</span>
        <span class="cmp-sep">·</span>
        <span class="cmp-meta">${label}</span>
      </div>
      <div class="cmp-right">
        <span style="font-size:13px;color:var(--topbar-text);font-variant-numeric:tabular-nums;margin-right:10px">08:42</span>
        <div class="cmp-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="9" cy="9" r="7.5"/>
            <path d="M6.8 6.8a2.2 2.2 0 0 1 4.3.7c0 1.5-2.1 1.8-2.1 3.5"/>
            <circle cx="9" cy="13.5" r="0.7" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div class="cmp-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="2,6 9,2.5 16,6 9,9.5 2,6"/>
            <polyline points="2,9.5 9,13 16,9.5"/>
            <line x1="2" y1="6" x2="2" y2="9.5"/>
            <line x1="16" y1="6" x2="16" y2="9.5"/>
            <line x1="9" y1="9.5" x2="9" y2="13"/>
            <polyline points="2,7.7 9,11.2 16,7.7"/>
          </svg>
        </div>
        <div class="cmp-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="9" r="2.5"/>
            <path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.6 3.6l1.4 1.4M13 13l1.4 1.4M14.4 3.6l-1.4 1.4M5 13l-1.4 1.4"/>
          </svg>
        </div>
      </div>
    </div>
  `;

  // ── Grid
  const middle = document.createElement('div');
  middle.className = 'cmp-middle';

  const grid = document.createElement('div');
  grid.className = 'cmp-grid';
  grid.style.cssText = `
    grid-template-columns: repeat(${size}, ${CELL_PX}px);
    grid-template-rows: repeat(${size}, ${CELL_PX}px);
    width: ${GRID_PX}px; height: ${GRID_PX}px;
    font-size: ${FONT_PX}px;
  `;

  cells.forEach((cell, idx) => {
    const row = Math.floor(idx / size);
    const col = idx % size;
    const box = Math.floor(row / BOX) * BOX + Math.floor(col / BOX);
    const isHl = !cell.sel && (row === selRow || col === selCol || box === selBox);
    const div = document.createElement('div');
    div.className = 'cmp-cell' +
      (cell.sel   ? ' sel'   : '') +
      (cell.given ? ' given' : '') +
      (isHl       ? ' hl'   : '');
    div.style.fontSize = FONT_PX + 'px';
    div.textContent = cell.v ? cellLabel(cell.v) : '';

    const borderR = (col + 1) % BOX === 0 && col < size - 1 ? '2px solid var(--border-box)' : '1px solid var(--border-cell)';
    const borderB = (row + 1) % BOX === 0 && row < size - 1 ? '2px solid var(--border-box)' : '1px solid var(--border-cell)';
    div.style.borderRight  = col === size - 1 ? 'none' : borderR;
    div.style.borderBottom = row === size - 1 ? 'none' : borderB;

    grid.appendChild(div);
  });

  middle.appendChild(grid);
  screen.appendChild(middle);

  // ── Number picker
  const picker = document.createElement('div');
  picker.className = 'cmp-picker';
  picker.style.gap = size > 16 ? '2px' : '6px';

  for (let n = 1; n <= size; n++) {
    const slot = document.createElement('div');
    slot.className = 'cmp-slot' + (n === curNum ? ' cur' : '');
    slot.style.cssText = `width:${slotW}px; font-size:${slotFont}px; flex-shrink:0;`;
    slot.textContent = cellLabel(n);
    picker.appendChild(slot);
  }
  const erase = document.createElement('div');
  erase.className = 'cmp-slot er';
  erase.style.cssText = `width:${slotW}px; font-size:${Math.round(slotFont * 0.75)}px; flex-shrink:0;`;
  erase.textContent = '⌫';
  picker.appendChild(erase);

  screen.appendChild(picker);

  // ── Warning note
  if (note) {
    const n = document.createElement('div');
    n.className = 'cmp-note';
    n.textContent = note;
    screen.appendChild(n);
  }

  return screen;
}

function buildComparisons() {
  const section = document.getElementById('comparisons');
  section.innerHTML = '';
  CMP_SIZES.forEach(cfg => {
    const lbl = document.createElement('div');
    lbl.style.cssText = 'font-size:11px;color:#555;letter-spacing:0.08em;text-transform:uppercase;align-self:flex-start;margin-bottom:-16px';
    lbl.textContent = `── ${cfg.label}`;
    section.appendChild(lbl);
    section.appendChild(buildComparisonScreen(cfg));
  });
}

// ── Init ─────────────────────────────────────────────────────────────────────
buildGrid();
buildIsoCube();
buildLayerTabs();
updateTopBar();
buildComparisons();
</script>
</body>
</html>
